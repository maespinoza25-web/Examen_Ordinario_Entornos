<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Búsqueda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #e8e8e8; 
    }

 
    nav {
      display: flex;
    }

    nav a {
      padding: 12px 30px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 15px;
      background-color: #1a6eb5;
      border-right: 2px solid #e8e8e8;
    }

    nav a:hover {
      background-color: #4fc3f7;
    }

    /*Contenedor*/
    .contenedor {
      margin: 40px auto;
      width: 600px;
      background-color: #3dbdbd;
      border: 6px solid #1a6eb5;
      border-radius: 20px;
      padding: 35px 40px;
    }

    /*Filas*/
    .fila {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    .fila label {
      width: 100px;
      font-weight: bold;
      color: #003366;
      font-size: 16px;
    }

    .fila input[type="text"] {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 3px;
      font-size: 14px;
    }

    /*Buscar*/
    .btn-buscar {
      background-color: white;
      border: 2px solid #ccc;
      padding: 30px 25px;
      font-weight: bold;
      font-size: 16px;
      color: #1a6eb5;
      cursor: pointer;
      margin-left: 15px;
      border-radius: 4px;
    }

    .btn-buscar:hover {
      background-color: #d0eeff;
    }

    .grupo {
      display: flex;
      align-items: center;
    }

    .campos {
      flex: 1;
    }
  </style>
</head>
<body>

  
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Conócenos</a>
    <a href="#">Productos</a>
    <a href="#">Registro</a>
    <a href="#">Contacto</a>
  </nav>

 
  <div class="contenedor">

    <!-- Fila Web -->
    <div class="fila">
      <label>Web:</label>
      <input type="text" value="https://accounts.google.com/SignUp">
    </div>


</body>
</html>
